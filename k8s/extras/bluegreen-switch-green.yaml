# Aplicar este arquivo troca o tráfego para o GREEN (v2.0).
apiVersion: v1
kind: Service
metadata:
  name: loja-api-bg
  namespace: n3-gustavogarshal
spec:
  type: NodePort
  selector:
    app: loja-api-bg
    cor: green              # <- ESTA linha decide quem recebe o tráfego
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30081
