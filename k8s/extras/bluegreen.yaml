# Blue-Green: dois ambientes completos; o Service aponta para um deles (blue = v1.0, green = v2.0).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loja-api-blue
  namespace: n3-gustavogarshal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loja-api-bg
      cor: blue
  template:
    metadata:
      labels:
        app: loja-api-bg
        cor: blue
    spec:
      containers:
        - name: api
          image: loja-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: loja-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: loja-secret, key: MYSQL_PASSWORD }
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loja-api-green
  namespace: n3-gustavogarshal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loja-api-bg
      cor: green
  template:
    metadata:
      labels:
        app: loja-api-bg
        cor: green
    spec:
      containers:
        - name: api
          image: loja-api:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: loja-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: loja-secret, key: MYSQL_PASSWORD }
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: loja-api-bg
  namespace: n3-gustavogarshal
spec:
  type: NodePort
  selector:
    app: loja-api-bg
    cor: blue              # <- ESTA linha decide quem recebe o tráfego
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30081
