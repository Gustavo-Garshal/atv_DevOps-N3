# Gerador de carga DENTRO do cluster (port-forward não balanceia, então não serve para o HPA).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadtest
  namespace: n3-gustavogarshal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loadtest
  template:
    metadata:
      labels:
        app: loadtest
    spec:
      containers:
        - name: gerador
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - while true; do wget -q -T 5 -O /dev/null "http://loja-api/carga?rounds=2"; done
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { cpu: 200m, memory: 32Mi }
