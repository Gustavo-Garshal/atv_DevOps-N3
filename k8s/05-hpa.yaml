apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loja-api
  namespace: n3-gustavogarshal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loja-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50     # 50% do REQUEST (100m) = 50m por pod
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60 # padrão é 300s; encurtado para a demo
