apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: n3-gustavogarshal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: n3-gustavogarshal
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
