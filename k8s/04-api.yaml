apiVersion: apps/v1
kind: Deployment
metadata:
  name: loja-api
  namespace: n3-gustavogarshal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1             # pode ter 1 pod a mais durante a troca
      maxUnavailable: 0       # nunca fica abaixo do número desejado
  selector:
    matchLabels:
      app: loja-api
      track: stable
  template:
    metadata:
      labels:
        app: loja-api
        track: stable
    spec:
      containers:
        - name: api
          image: loja-api:1.0
          imagePullPolicy: IfNotPresent   # usa a imagem local (minikube image load)
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: loja-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: loja-secret, key: MYSQL_PASSWORD }
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: loja-api
  namespace: n3-gustavogarshal
spec:
  type: NodePort
  selector:
    app: loja-api             # sem "track": pega stable E canary
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
